<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Events</title>

<style>

body{
    font-family: Arial;
    margin:20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.card{
    border:1px solid #ddd;
    padding:20px;
    cursor:pointer;
}

.card:hover{
    background:#f5f5f5;
}

</style>
</head>
<body>

<h1>Events</h1>

<div class="gallery"></div>

<script>

fetch('data.json')
.then(r=>r.json())
.then(data=>{

    const gallery=document.querySelector('.gallery');

    data.forEach(item=>{

        gallery.innerHTML+=`
        <div class="card"
             onclick="window.location='details.html?id=${item.id}'">

            <h3>${item.title}</h3>

            <p>${item.date}</p>

            <p>${item.summary}</p>

        </div>
        `;
    });
});

</script>

</body>
</html>
