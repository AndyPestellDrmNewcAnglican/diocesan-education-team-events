<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>On-Demand Training</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
}

#searchBox{
    width:100%;
    max-width:400px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    border:1px solid #ddd;
    padding:15px;
    border-radius:5px;
    background:#fff;
    cursor:pointer;
    transition:all .2s ease;
}

.card:hover{
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    transform:translateY(-2px);
}

.card-link{
    text-decoration:none;
    color:inherit;
}

.pagination{
    margin-top:20px;
    text-align:center;
}

</style>
</head>

<body>

<h1>On-Demand Training</h1>

<p>
<input
    id="searchBox"
    type="text"
    placeholder="Search training..."
    onkeyup="applyFilters()">
</p>

<div id="eventlist">
    Loading training...
</div>

<div id="pagination" class="pagination"></div>

ondemand-training.jsscript>

</body>
</html>
